<style>
:root{
  --bg:#f4efe6;--card:#fffcf7;--ink:#1f2523;--muted:#6c706b;--line:#e2dacb;
  --accent:#115e57;--accent-soft:#e3efeb;
  --booked:#115e57;--booked-bg:#dcece7;
  --pencil:#a86a12;--pencil-bg:#f9ecd2;
  --pending:#b3412f;--pending-bg:#f8e1db;
  --handed:#6a55c9;--handed-bg:#ebe7fa;
  --cover:#2b64a3;--cover-bg:#e2ebf7;
  --free:#2c8048;--free-bg:#e1f1e5;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:Manrope,sans-serif;font-weight:650;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hide{display:none!important}
.muted{color:var(--muted)}
.sm{font-size:13px}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--muted);margin:0 0 4px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}

.hadd{display:none}

nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--tint,var(--bg))}
.tab.on{background:var(--ink);color:#fff}
.ti{display:none;width:23px;height:23px}
.navav{display:none;width:25px;height:25px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;font-size:10px;font-weight:700;place-items:center;flex:none;box-sizing:border-box}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* buttons */
.primary,.ghost{border-radius:10px;padding:9px 16px;font-weight:600;border:1px solid transparent}
.primary{background:var(--accent);color:#fff}
.primary:hover{filter:brightness(1.08)}

.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}

.monthnav{display:flex;align-items:center;gap:10px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}

.inline{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.inline select{padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.nw{white-space:nowrap}
.paycb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.actions.profacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.resetline{margin:18px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.resetline .link{font-size:12px;padding:0}
.check{display:flex;align-items:center;gap:6px;font-size:14px}
@media (max-width:760px){.feecheck{margin:10px 0}}

.banner{background:var(--pending-bg);border:1px solid #efc3b8;color:#6e2518;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.banner .link{color:var(--pending)}
.banners{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
.banners.two{grid-template-columns:1fr 1fr}
.banners .banner{margin:0;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px}
.banners .banner strong{font-size:14px}
.banners .banner .link{text-align:left;font-size:13px}
.banner.ok{background:var(--handed-bg);border-color:#dcc8fb;color:#4c1d95}
.banner.ok .link{color:var(--handed)}
.ptabbed{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.pthead{font-size:18px;margin-bottom:10px}
.ptabs{max-width:none;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
.ptabs::-webkit-scrollbar{display:none}
.subnav.ptabs button{flex:1 1 auto;padding:8px 6px;font-size:14px;white-space:nowrap}
@media (max-width:760px){.subnav.ptabs button{font-size:13px;padding:8px 4px}}
.ptabbed .psec{border-top:0;margin-top:0;padding-top:12px}
.ptabbed .psec>h3{display:none}
.perfas-note{}
#perfas .rolepick{flex-wrap:nowrap;gap:6px;margin-top:5px}
#perfas .rolepick label{flex:1 1 auto;justify-content:center;white-space:nowrap;position:relative;padding:9px 8px;font-size:13px;gap:0;cursor:pointer}

#perfas .rolepick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#perfas .rolepick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.gstyle{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-bottom:12px}
.avtools{width:100%}
body:not(.lite) .avtools{row-gap:14px}body:not(.lite) .avtools>.btnpair{margin-top:4px}body:not(.lite) [data-tab=availability] .summary-line,body:not(.lite)[data-tab=availability] .summary-line{margin-top:4px}
.subnav.av{margin:0;max-width:none;width:100%;flex:1 1 100%}
#avweeks .ls{display:none}#avweeks.short .lf{display:none}#avweeks.short .ls{display:inline}
.subnav.av button{padding:7px 4px;font-size:13px;white-space:nowrap;min-width:0;flex:1 1 0}
@media (max-width:370px){.subnav.av button{font-size:12px;padding:7px 2px}.xn{display:none}}
@media (max-width:370px){.dtools>button.ghost{font-size:13px;padding-left:6px;padding-right:6px}.dtools>.subnav.tb{min-width:0}}
button.primary:disabled{opacity:.45;cursor:not-allowed}
.bookerok{display:flex;align-items:flex-start;gap:8px;font-weight:500;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.bookerok input{margin-top:3px;accent-color:var(--accent)}
.subnav.gs{margin:0;max-width:none;width:100%}
.subnav.gs button{padding:7px 4px;font-size:13px;white-space:nowrap;min-width:0}
.seg.sm button{padding:5px 11px;font-size:13px}
.gv-compact .cell,.gv-daylist .cell{min-height:58px;align-items:center;cursor:pointer}
.gv-compact .dn,.gv-daylist .dn{align-self:center}
.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cell.sel .dn{background:var(--accent);color:#fff}
.cell.sel.today .dn{background:var(--accent)}
.gv-stacked .cell{min-height:92px;gap:2px}
.gv-stacked .chip{font-size:11px;padding:2px 5px;border-radius:4px;border-left-width:2px;font-weight:600;color:var(--c)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.gv-details .cell{min-height:120px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 8px}
.dayhead h3{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dayhead button{white-space:nowrap;flex:none}
.weekv{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.wrow.today{border-color:var(--ink)}
.wrow .dblock{align-self:center}
.wgigs{flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.wgigs .chip{font-size:13px;padding:6px 8px;white-space:normal}
.wsub{display:block;font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfree{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;color:var(--muted);text-align:left;font-size:13px}
.wfree:hover{border-color:var(--accent);color:var(--accent)}
.yearv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ymon{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.ymt{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:0 0 6px;font-family:Manrope,sans-serif;font-weight:650;font-size:15px;color:var(--ink);text-align:left}
.ymt span{font-family:Manrope,sans-serif;font-size:11px;color:var(--muted);font-weight:600}
.ymt:hover{color:var(--accent)}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.ygrid i{font-style:normal;font-size:10px;color:var(--muted);font-weight:600}
.ygrid b{font-size:11px;font-weight:500;padding:3px 0;border-radius:5px;color:var(--ink)}
.ygrid b.has{background:var(--cb);color:var(--c);font-weight:700;cursor:pointer}
.ygrid b.td{outline:1.5px solid var(--ink)}
.legend{flex-wrap:nowrap;margin-bottom:4px}
.tiphint{margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-booked{--c:var(--booked);--cb:var(--booked-bg)}
.s-pencilled{--c:var(--pencil);--cb:var(--pencil-bg)}
.s-pending{--c:var(--pending);--cb:var(--pending-bg)}
.s-handed{--c:var(--handed);--cb:var(--handed-bg)}
.s-cover{--c:var(--cover);--cb:var(--cover-bg)}
.pill{color:var(--c);background:var(--cb)}

/* grid */
.grid{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gh,.gb{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.gh div{padding:9px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.cell{position:relative;min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#fbf7f0}
.cell.out{background:#f8f4ec}
.cell.out .dn{color:#b4ab9b}
.dn{font-size:13px;font-weight:600;padding:2px 4px;align-self:flex-start;border-radius:6px}
.cell.today .dn{background:var(--ink);color:#fff}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:var(--cb);color:var(--ink);font-size:12px;padding:4px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--c)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;color:inherit}
.row:hover{border-color:#cbbfa9;border-left-color:var(--c)}
.dblock{width:48px;text-align:center;flex:none}
.dblock span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dblock strong{font-family:Manrope,sans-serif;font-weight:800;font-size:24px;line-height:1.1}
.rmain{flex:1;min-width:0}
.ract{font-weight:600}
.rsub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpill{display:inline-flex;align-items:center;gap:6px}.rpill .nicon{margin-left:0;vertical-align:0}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.fee{font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:18px}
.card .big{font-family:Manrope,sans-serif;font-weight:800;font-size:28px;margin:6px 0}
.card .actions{margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat strong{display:block;font-family:Manrope,sans-serif;font-size:26px}
.section-h{font-size:18px;margin:22px 0 10px}

/* availability */
.weeks{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.wk{display:grid;grid-template-columns:86px repeat(var(--cols,7),minmax(0,1fr));gap:6px;align-items:center}
.linkrows{display:flex;flex-direction:column;gap:14px}

.actions.contact{flex-wrap:nowrap;gap:8px}

.plinks{display:flex;flex-direction:column;gap:6px;margin:-6px 0 16px}

.avleg{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:20px}
.bkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}.bkhead #avunit{flex:none;margin:0!important}.bkhead #avunit{padding:2px!important}.bkhead #avunit button{padding:4px 9px!important;font-size:12px!important;min-height:0!important;line-height:1.3}
.feerow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}.feerow .feecheck{flex:1 1 auto;min-width:0;margin:0}.feerow #avunit{flex:none;margin:0!important}.feerow .fcl{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.25}.feerow #avunit button{padding:6px 10px!important;font-size:13px!important}
.avleg{flex-wrap:wrap;row-gap:10px}.avleg>.legend{flex-wrap:wrap}.avleg>.subnav,.avleg>select,#avunit,.avmsel{margin-left:auto!important}

.a-out{background:transparent}
.wk.head div{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.day{border-radius:9px;padding:6px 0;text-align:center;font-size:13px;font-weight:600}
.a-free{background:var(--free-bg);color:var(--free)}

.avail{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.summary-line{margin:0 0 12px;font-weight:500}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}

.form input,.form select,.form textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:400;color:var(--ink)}

.warn{background:var(--pencil-bg);color:#6d4508;border-radius:10px;padding:8px 12px;font-size:13px}

/* modal */

#modal.show{display:flex}
.sheet{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.2)}

.picks{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
.pick{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.pick{width:100%;text-align:left;font:inherit;color:inherit}

.hosum{background:var(--tint,var(--bg));border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}

.dvbar{display:flex;justify-content:space-between;gap:10px;background:var(--tint,var(--bg));border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:16px;font-family:ui-monospace,Menlo,monospace}

function parseMsg(t){

  if(m){let yy=m[3]?+m[3]:y;if(yy<100)yy+=2000;o.date=iso(new Date(yy,+m[2]-1,+m[1]))}
  else{m=t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(\d{4}))?/i);
    if(m)o.date=iso(new Date(m[3]?+m[3]:y,mon[m[2].toLowerCase()],+m[1]));}
  const times=[...t.matchAll(/\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b|\b([01]?\d|2[0-3]):([0-5]\d)\b/gi)].map(x=>{
    if(x[3]){let h=+x[1]%12;if(x[3].toLowerCase()==='pm')h+=12;return pad(h)+':'+(x[2]||'00')}

  if(times.length===1)o.start=times[0];
  if(times.length>1){o.loadIn=times[0];o.start=times[1]}
  const pc=t.match(/\b([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})\b/i);if(pc)o.postcode=pc[1].toUpperCase();
  const v=t.match(/(?:\bat|venue:?)\s+(?:the\s+)?([A-Z][a-z'][A-Za-z']*(?:\s+(?:&|[A-Z][a-z'][A-Za-z']*))*)/);
  if(v)o.venue=(/^the /i.test(v[0].replace(/^(at|venue:?)\s+/i,''))?'The ':'')+v[1];
  else{const v2=t.match(/([A-Z][A-Za-z']+(?:\s+[A-Z][A-Za-z']+)*\s+(?:Hotel|Hall|Barn|Manor|Rooms|Club|Lodge|Pavilion|Arms|Inn|House))/);if(v2)o.venue=v2[1]}
  for(const p of state.payees){if(new RegExp('\\b'+first(p.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(t)||(p.org&&t.toLowerCase().includes(p.org.toLowerCase()))){o.payeeId=p.id;break}}
  {const et=guessType(t);if(et)o.eventType=et}
  {const m=t.match(/\bevery\s+(other\s+)?(mon|tue|wed|thu|fri|sat|sun)[a-z]*/i);if(m){o.freq=m[1]?'fortnightly':'weekly';o.rday=['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[2].toLowerCase())}}
  o.roles=[];if(/\b(sing|singer|singing|vocals?|vocalist)\b/i.test(t))o.roles.push('singer');if(/\bDJ\b/i.test(t))o.roles.push('dj');if(/\b(MC|compere|compère|host)\b/i.test(t))o.roles.push('mc');
  if(/\b(own|your|a)\s+(PA|sound ?system|speakers)\b|\bbring\b.*\bPA\b/i.test(t))o.equip='own';
  else if(/\b(house|venue'?s?)\s+(PA|system|decks|kit)\b|\bdecks provided\b/i.test(t))o.equip='venue';
  return o;
}

function pubSections(cmp){
  const P=state.profile,fee=r=>P.showFee&&+P[ROLE_FEE[r]]?`<span class="sm fromfee"><span class="fdot">•</span>From ${money(P[ROLE_FEE[r]])}</span>`:'';

  if(P.roles.includes('mc'))h+=`<div class="pubsec"><h4>MC / Compère ${fee('mc')}</h4>${line('Events',P.mcEvents)}</div>`;
  {const k=[],a=pliStat(P),b=patStat(P);
     if(docValid(P.pli,a))k.push(`<p class="tk">Public liability insurance${P.pliCover?' ('+esc(P.pliCover)+' cover)':''}${a?`<span class="muted sm">, valid to ${shortDate(a.date)}</span>`:''}</p>`);
     if(docValid(P.pat,b))k.push(`<p class="tk">Equipment PAT tested${b?`<span class="muted sm">, last tested ${shortDate(b.tested)}</span>`:''}</p>`);
   if(k.length)h+=`<div class="pubsec"><h4>Insurance and safety</h4>${k.join('')}</div>`;}
  if(P.roles.some(needsKit)){
    const k=[];
    if(P.venueKit)k.push('<p class="tk">Happy to use the venue’s equipment</p>');

/* ---------- invoices ---------- */
function invoiceData(ym){
  const by={};
  const add=(pid,g,note)=>{const a=(by[pid]=by[pid]||[]);a.push({g,note,amt:+g.fee||0});if(g.equip==='own'&&+g.paFee)a.push({g,note:'',amt:+g.paFee,pa:true})};
  const[iy,im]=ym.split('-').map(Number);
  for(const g of gigsBetween(iso(new Date(iy,im-1,1)),iso(new Date(iy,im,0)))){
    const s=gigState(g);if(s==='pencilled')continue;
    if(s==='handed')continue;
    add(g.payeeId,g,s==='cover'?'Stand-in for '+g.coverFrom:s==='pending'?'Handover pending':'');
  }
  return {by};
}
function invoicesFor(ym){
  const {by}=invoiceData(ym),[y,m]=ym.split('-').map(Number),P=state.profile;
  const initials=P.name.split(' ').map(x=>x[0]).join('').toUpperCase();
  const invDate=new Date(y,m,0),PT=state.profile,due=PT.payTerms?new Date(invDate):null;if(due)due.setDate(due.getDate()+(+PT.payDays||14));
  return Object.keys(by).map((pid,i)=>{
    const lines=by[pid].sort((a,b)=>byDate(a.g,b.g)||(a.pa?1:0)-(b.pa?1:0));
    return {num:`${initials}-${y}${pad(m)}-${pad(i+1)}`,ym,pid,payee:payee(pid)||{name:'No client set',org:'',address:'',email:''},lines,total:lines.reduce((a,l)=>a+l.amt,0),invDate,due};
  });
}
function sentOn(num){

}

function bkNudge(){const S=state.settings||{},now=Date.now();if(state.sample||!state.gigs.length)return '';if(!S.firstUse){state.settings=state.settings||{};state.settings.firstUse=now;save();return ''}
  if((S.bkSnooze||0)>now)return '';const last=S.lastBackup||S.firstUse;if(now-last<30*864e5)return '';
  return `<div class="bknudge"><span class="bkic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span><span class="bkt"><b>Time for a backup</b><small>${S.lastBackup?'Your last backup was over a month ago.':'You haven’t backed up your diary yet.'} Your gigs are only on this phone.</small></span><span class="bkb"><button class="primary sm" data-a="bkup">Back up</button><button class="ghost sm" data-a="bklater">Later</button></span></div>`}

function allIssued(){const t=new Date(),ds=state.gigs.map(g=>g.date).filter(Boolean).sort();if(!ds.length)return [];let d=fromIso(ds[0]);d=new Date(d.getFullYear(),d.getMonth(),1);const out=[];while(d<=t){const ym=iso(d).slice(0,7);invoicesFor(ym).forEach(i=>{if(i.invDate<=t)out.push(i)});d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}

function findInv(key){const [ym,pid]=key.split('|');return invoicesFor(ym).find(i=>i.pid===pid)}
function taxStart(){const t=new Date(),y=t.getFullYear();return iso(t)>=y+'-04-06'?y:y-1}
function taxGigs(y){return gigsBetween(y+'-04-06',(y+1)+'-04-05').filter(g=>{const s=gigState(g);return s!=='pencilled'&&s!=='handed'})}
function vTaxYear(){const y=ui.taxY||taxStart(),cur=taxStart(),today=iso(new Date()),gs=taxGigs(y),done=gs.filter(g=>g.date<=today),ahead=gs.filter(g=>g.date>today),sum=a=>a.reduce((t,g)=>t+gigTotal(g),0),exS=a=>a.reduce((t,g)=>t+gigExp(g),0);
  const months=[];for(let i=0;i<12;i++){const d=new Date(y,3+i,1);months.push({k:iso(d).slice(0,7),l:MONTHS[d.getMonth()].slice(0,3),yr:d.getFullYear()})}
  const tot=months.map(m=>({...m,v:sum(gs.filter(g=>g.date.slice(0,7)===m.k&&!(m.k===y+'-04'&&g.date<y+'-04-06')&&!(m.k===(y+1)+'-04'))),fut:m.k>today.slice(0,7)}));
  const apr2=sum(gs.filter(g=>g.date>=(y+1)+'-04-01'));if(apr2)tot[tot.length]={k:(y+1)+'-04',l:'1-5 Apr',yr:y+1,v:apr2,fut:(y+1)+'-04'>today.slice(0,7)};
  const max=Math.max(1,...tot.map(m=>m.v));
  return `<div class="toolbar subbar"><div class="monthnav taxnav"><button class="icon" data-a="taxy" data-id="${y-1}" aria-label="Previous tax year"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M15 5l-7 7 7 7"/></svg></button><h3 class="subhead">${y}/${String(y+1).slice(2)}</h3><button class="icon" data-a="taxy" data-id="${y+1}" aria-label="Next tax year"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M9 5l7 7-7 7"/></svg></button><button class="ghost sm fctoday${y===cur?' isnow':''}" data-a="taxy" data-id="${cur}"${y===cur?' disabled aria-disabled="true"':''}>This year</button></div></div>
  <p class="muted sm taxrange">6 April ${y} to 5 April ${y+1}</p>
  <div class="stats"><div class="stat"><span>Earned so far</span><strong><span class="pv">${money(sum(done))}</span></strong></div><div class="stat"><span>Booked ahead</span><strong><span class="pv">${money(sum(ahead))}</span></strong></div><div class="stat"><span>Gigs</span><strong>${gs.length}</strong></div></div>
  <div class="stats taxprofit"><div class="stat"><span>Expenses so far</span><strong><span class="pv">${money(exS(done))}</span></strong></div><div class="stat"><span>Profit so far</span><strong><span class="pv">${money(sum(done)-exS(done))}</span></strong></div></div>
  <div class="taxbars" role="list">${tot.map(m=>`<div class="taxbar${m.fut?' fut':''}" role="listitem"><span class="tbl">${m.l}</span><span class="tbt"><i style="width:${m.v?Math.max(2,m.v/max*100):0}%"></i></span><span class="tbv${m.v?'':' muted'}"><span class="pv">${money(m.v)}</span></span></div>`).join('')}</div>

/* ---------- PDF (built in the browser, no library) ---------- */
function pdfBuilder(){
  const W=595,H=842,pages=[],imgs=[];let c=null;
  const enc=s=>String(s??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/·/g,'-').replace(/[^\x00-\xff]/g,'').replace(/[\\()]/g,m=>'\\'+m);
  const cw=ch=>/[0-9£$#]/.test(ch)?556:/[.,:;' ]/.test(ch)?278:/[il|]/.test(ch)?222:/[A-Z]/.test(ch)?667:/[mw]/.test(ch)?833:500;
  const width=(s,sz)=>[...String(s)].reduce((a,ch)=>a+cw(ch),0)*sz/1000;
  return {
    page(){c=[];pages.push(c)},
    text(x,y,s,sz=10,bold=false,align){if(align==='right')x-=width(s,sz);c.push(`BT /${bold?'F2':'F1'} ${sz} Tf ${x.toFixed(1)} ${(H-y).toFixed(1)} Td (${enc(s)}) Tj ET`)},
    image(x,y,w,h,jpgDataUrl,iw,ih){const bin=atob(jpgDataUrl.split(',')[1]);imgs.push({bin,iw,ih});c.push(`q ${w.toFixed(1)} 0 0 ${h.toFixed(1)} ${x.toFixed(1)} ${(H-y-h).toFixed(1)} cm /Im${imgs.length} Do Q`)},
    line(x1,y1,x2,y2){c.push(`0.75 G 0.6 w ${x1} ${H-y1} m ${x2} ${H-y2} l S`)},
    bytes(){
      const objs=[];const add=o=>{objs.push(o);return objs.length};
      add('<< /Type /Catalog /Pages 2 0 R >>');add('');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids=[],imIds=imgs.map(m=>add(`<< /Type /XObject /Subtype /Image /Width ${m.iw} /Height ${m.ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${m.bin.length} >>\nstream\n${m.bin}\nendstream`));
      const xo=imIds.length?` /XObject << ${imIds.map((id,i)=>`/Im${i+1} ${id} 0 R`).join(' ')} >>`:'';
      for(const pg of pages){const st=pg.join('\n');const ci=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);
        kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xo} >> /Contents ${ci} 0 R >>`))}
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
      let out='%PDF-1.4\n';const offs=[];
      objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
      const xr=out.length;
      out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
    }
  };
}
function drawInvoice(pdf,inv){
  const P=state.profile,p=inv.payee,f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  pdf.page();
  pdf.text(50,72,'INVOICE',24,true);pdf.text(50,92,inv.num,10);
  let dy=70;if(P.logoJpg&&P.logoW){const k=Math.min(150/P.logoW,55/P.logoH),lw=P.logoW*k,lh=P.logoH*k;pdf.image(545-lw,36,lw,lh,P.logoJpg,P.logoW,P.logoH);dy=36+lh+16}
  pdf.text(545,dy,'Invoice date: '+f(inv.invDate),10,false,'right');if(inv.due)pdf.text(545,dy+16,'Due: '+f(inv.due),10,false,'right');
  const from=[P.name,...String(P.address||'').split('\n'),P.email,P.phone].filter(Boolean);
  const to=[p.name,p.org,...String(p.address||'').split('\n'),p.email].filter(Boolean);
  let y=Math.max(135,dy+(inv.due?46:30));pdf.text(50,y,'FROM',8,true);pdf.text(320,y,'TO',8,true);
  from.forEach((l,i)=>pdf.text(50,y+16+i*14,l,10,i===0));to.forEach((l,i)=>pdf.text(320,y+16+i*14,l,10,i===0));
  y+=16+Math.max(from.length,to.length)*14+26;
  pdf.text(50,y,'DATE',8,true);pdf.text(140,y,'DESCRIPTION',8,true);pdf.text(545,y,'AMOUNT',8,true,'right');pdf.line(50,y+7,545,y+7);
  y+=26;
  for(const l of inv.lines){
    let d=l.pa?'PA and equipment hire':`${l.g.act}, ${l.g.venue}`;if(d.length>64)d=d.slice(0,62)+'...';
    pdf.text(50,y,fmtDate(l.g.date),10);pdf.text(140,y,d,10);pdf.text(545,y,money(l.amt),10,false,'right');
    if(!l.pa&&hoursOf(l.g)){y+=13;pdf.text(140,y,hrsText(hoursOf(l.g)),8)}
    if(l.note&&l.note!=='Handover pending'){y+=13;pdf.text(140,y,l.note,8)}
    y+=22;if(y>690)break;
  }
  pdf.line(50,y-10,545,y-10);pdf.text(140,y+8,'Total due',12,true);pdf.text(545,y+8,money(inv.total),12,true,'right');
  y+=56;pdf.text(50,y,'PAY BY BANK TRANSFER',8,true);pdf.text(320,y,'NOTES',8,true);
  [P.bankName,P.bankBank,'Account '+P.account,'Sort code '+P.sortCode,'Reference '+inv.num].filter(Boolean).forEach((l,i)=>pdf.text(50,y+16+i*14,l,10));
  {const out=[];String(invNote(inv)).split('\n').forEach(par=>{let ln='';par.split(' ').forEach(wd=>{if((ln+' '+wd).trim().length>42){out.push(ln);ln=wd}else ln=(ln+' '+wd).trim()});out.push(ln)});out.slice(0,10).forEach((l,i)=>pdf.text(320,y+16+i*14,l,10))}
}

function summaryCSV(invs,months){

  const a=pliStat(P),b=patStat(P);if(docValid(P.pli,a)){o.pli=1;put('pc',P.pliCover);put('pe',P.pliExpiry)}if(docValid(P.pat,b)){o.pat=1;put('pl',P.patLast)}
  return linkFor('a',o)}
const PUBKEYS=['name','stage','roles','phone','email','okCall','okWa','okEmail','instruments','gMusician','genres','gSinger','singStyles','singFormat','gDj','djStyles','djSetup','mcEvents','pli','pliCover','pliExpiry','pat','patLast','venueKit','ownPA','paCapacity','paDesc','lighting','lightingDesc','windowWeeks','windowUnit','windowMonths','weekendsOnly','showReal','avFrom','avTo','loc'];
const LITEKEYS=['name','stage','roles','phone','email','okCall','okWa','okEmail','showReal','windowWeeks','windowUnit','windowMonths','weekendsOnly'];
const AVKEYS=['name','stage','showReal','roles','windowWeeks','windowUnit','windowMonths','weekendsOnly','avFrom','avTo'];
function pubLink(actId,withPhoto,avOnly){return withAct(actId&&actById(actId)?actId:'main',()=>{const P=state.profile,p={};
  (avOnly?AVKEYS:isLite()?LITEKEYS:PUBKEYS).forEach(k=>{const v=P[k];if(v!==undefined&&v!==null&&v!==''&&!(Array.isArray(v)&&!v.length))p[k]=v});
  if(P.showReal===false&&(P.stage||'').trim())delete p.name;
  if(isLite()||!avRange(P)){delete p.avFrom;delete p.avTo}
  if(p.loc){const l=isLite()?null:pubLoc(P.loc);if(l)p.loc=l;else delete p.loc}
  if(P.showFee&&!avOnly){p.showFee=true;(isLite()?['feeMusician','feeSinger','feeDj','feeMc']:['feeMusician','feeSinger','feeDj','feeMc','paFee']).forEach(k=>{if(+P[k])p[k]=+P[k]})}
  const lk=avOnly||isLite()?[]:(P.links||[]).filter(l=>l.url).map(l=>({label:l.label||'',url:l.url}));if(lk.length)p.links=lk;
  const t=new Date();t.setHours(0,0,0,0);const b=[],q=[],n=Math.max(winWeeks(P)*7+35,winDays(P)+7);
  const u=[];for(let i=0;i<n;i++){const st=myDay(iso(addDays(t,i)));if(st==='booked')b.push(i);else if(st==='pencilled')q.push(i);else if(st==='away')u.push(i)}
  if(isLite()){p.windowUnit='m';if(!p.windowMonths)p.windowMonths=2}const o={x:packPub(p),at:iso(t)};if(avOnly)o.v=1;if(isLite()&&!avOnly)o.c=1;if(b.length)o.b=b;if(q.length)o.q=q;if(u.length)o.u=u;if(withPhoto&&P.photoThumb)o.i=P.photoThumb;return linkFor('p',o)})}
function makeThumb(src,cb){const img=new Image();img.onload=()=>{const n=56,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),k=Math.min(img.width,img.height);x.fillStyle='#fff';x.fillRect(0,0,n,n);x.drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,n,n);cb(c.toDataURL('image/jpeg',.6))};img.onerror=()=>cb(null);img.src=src}
function ensureThumbs(){const list=[state.profile,...acts()].filter(o=>o.photo&&!o.photoThumb);list.forEach(o=>makeThumb(o.photo,t=>{if(t&&o.photo){o.photoThumb=t;save()}}))}

let QRS=null,QRT=0;
function stopScan(){if(QRT){cancelAnimationFrame(QRT);QRT=0}if(QRS){QRS.getTracks().forEach(t=>t.stop());QRS=null}}
function gotQR(text){const L=readLink(text);if(L&&L.k==='r'){stopScan();closeModal();applyReply(L.d);return true}if(L&&L.k==='x'){stopScan();closeModal();applyTakeBack(L.d);return true}if(!L||!'ap'.includes(L.k)){toast(('That isn’t a '+APP_NAME+' QR code'));return false}stopScan();return addFromLink(L)}
function decodeFrom(src,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);const d=x.getImageData(0,0,w,h);const r=jsQR(d.data,w,h,{inversionAttempts:'dontInvert'});return r&&r.data}

function scanQR(reply){
  modal(`<div class="mh"><div><h3>${reply?(find(reply)&&find(reply).source==='covering'?'Scan take-back QR':'Scan their reply'):'Scan a QR code'}</h3></div>${X}</div>
  <p style="margin-top:0">${reply?(find(reply)&&find(reply).source==='covering'?`Only needed if ${esc(first(find(reply).coverFrom||'they'))} has taken this gig back from you. They tap “Take the gig back”, then “Show QR”. Point your camera at their code and the gig comes out of your diary.`:'Ask the stand-in to tap “Show QR” after they reply, then point your camera at it. The gig updates straight away.'):'Ask them to open Add to team and tap “My QR”, then point your camera at it.'}</p>
  <div class="scanbox"><video id="qrvid" playsinline muted></video><div class="scanframe"></div><p id="scanmsg" class="scanmsg">Starting camera…</p></div>
  <input type="file" id="qrimgin" accept="image/*" class="hide">
  <div class="invbtns"><button class="ghost" data-a="qrphoto">Use a photo</button><button class="ghost" data-a="${reply?'open':'adddep'}" data-id="${reply||''}">Back</button></div>
  ${reply?'':'<p class="muted sm" style="margin-top:10px">Their name, number, roles and kit are filled in from the code.</p>'}`);
  const v=$('#qrvid'),msg=t=>{const e=$('#scanmsg');if(e)e.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Camera not available here. Use a photo instead.');return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(st=>{if(!$('#qrvid')){st.getTracks().forEach(t=>t.stop());return}QRS=st;v.srcObject=st;v.play();msg('');
    const bd=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;let busy=false;
    const tick=async()=>{if(!QRS)return;if(!busy&&v.readyState>=2){busy=true;try{let t=null;if(bd){const r=await bd.detect(v);t=r[0]&&r[0].rawValue}else{const w=480,h=Math.round(480*v.videoHeight/v.videoWidth)||480;t=decodeFrom(v,w,h)}if(t&&gotQR(t))return}catch(e){}busy=false}QRT=requestAnimationFrame(tick)};tick()})
  .catch(()=>msg('Camera blocked. Allow camera access, or use a photo instead.'))}

function vHelp(){
  const LQ=['Can I rely on the figures for my tax return?','How do I know who still owes me?','Can I track expenses?','What does the Tax year page show?','How do repeating gigs work?','Can I mark days I’m away or can’t work?','Can I find stand-ins near a gig?','Who can see where I’m based?','Can I show a set period, like 2 July to 17 August?','Can I see a full scrolling calendar?','Can I see my gigs in Google, Apple or Outlook calendar?','How do deposits work?','What do the PLI and PAT tags mean?','Can I see my availability in months instead of weeks?','Can I perform under more than one name?','What should I put under “Own decks or controller”?','How are invoices made?','Can I change an invoice?','Where do my bank details go?','How do I send invoices to my accountant?','What are clients?','Why add my PLI and PAT details?'];
  const Q=(q,a)=>isLite()&&LQ.includes(q)?'':`<details><summary>${q}</summary>${a}</details>`;
  return `<div class="toolbar"><div class="phwrap"><div class="pagehead setbar"><button class="backbtn" data-a="tab" data-id="${ui.helpFrom||'profile'}" aria-label="Back to ${({diary:'diary',availability:'bookings',deps:'my team',invoices:'payments'})[ui.helpFrom]||'profile'}" title="Back to ${({diary:'diary',availability:'bookings',deps:'my team',invoices:'payments'})[ui.helpFrom]||'profile'}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Help</h2></div><p class="muted helpintro">Everything you need to get the most out of ${APP_NAME}. Start with what the diary colours mean, then tap any question below for a quick answer.</p></div></div>
  <h3 class="hsub" style="margin-top:0">What the colours mean</h3>
  <div class="helpkey">${Object.keys(STATUS_TIPS).map(k=>`<div><span class="pill s-${k}">${STATUS_TIPS[k][0]}</span><p>${STATUS_TIPS[k][1]}</p></div>`).join('')}</div>
  <p class="muted sm" style="margin:8px 0 0">Tap a colour in the Diary key to show only those gigs. Tap it again, or tap “Clear filter”, to show everything.</p>
  <h3 class="hsub">What the tags mean</h3>
  <p class="eyebrow tagsub">On gig tiles</p>
  <div class="helpkey tagkey"><div><span class="tk2"><span class="tag role">Musician</span></span><p>The role you’re booked as for the gig.</p></div><div><span class="tk2"><span class="tag">↻ Repeats</span></span><p>Part of a repeating gig or residency.</p></div><div><span class="tk2"><span class="tag pa">Own PA</span></span><p>You’re bringing your own PA system.</p></div><div><span class="tk2"><span class="tag actt">Act name</span></span><p>Which of your acts the gig is for. Only shows if you have more than one act.</p></div><div><span class="tk2"><span class="tag clash">⚠ Clash</span></span><p>Overlaps another gig on the same day.</p></div><div><span class="tk2"><span class="tag ddue">Deposit due</span><span class="tag dlate">Deposit overdue</span><span class="tag dpaid">Deposit paid</span></span><p>A deposit is set for the gig. Overdue means the due date has passed and it isn’t marked as paid.</p></div></div>
  <p class="eyebrow tagsub">On stand-in cards</p>
  <div class="helpkey tagkey"><div><span class="tk2"><span class="st st-app">On app</span></span><p>Uses ${APP_NAME}. You added them from their code or link.</p></div><div><span class="tk2"><span class="st st-inv">Invited</span></span><p>You’ve sent them an invite to ${APP_NAME}.</p></div><div><span class="tk2"><span class="st st-off">Not on app</span></span><p>Added by hand or from your contacts.</p></div><div><span class="tk2"><span class="tag pa">Own PA</span></span><p>Can bring their own PA system.</p></div><div><span class="tk2"><span class="tag ins">PLI</span> <span class="tag ins">PAT</span></span><p>Valid insurance or PAT test on file.</p></div><div><span class="tk2"><span class="tag due">PLI ending soon</span><span class="tag patdue">PAT ending soon</span></span><p>Runs out within 30 days.</p></div><div><span class="tk2"><span class="tag bad">PLI expired</span><span class="tag bad">PAT expired</span></span><p>Has expired. Some venues won’t let the stand-in play without it.</p></div></div>
  <div class="faq">
  <h3 class="hsub">Your diary<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  ${Q('How do I add a gig?','<p>Tap the + button at the top right of the Diary page (or “+ Add gig” on a computer). In Calendar view you can also tap a date to add a gig on that day. If you have more than one act, pick which act the gig is for.</p><p>The first time you add a gig on a clean diary, you’re asked for your name, what you perform as and your mobile. These go on your gigs, handovers and public page.</p><p>Pick an event type from the list, or choose “Other” to type your own. Under Equipment, choose whether the venue provides it or you bring your own PA. This works for every role, including musicians.</p>')}
  ${Q('How do repeating gigs work?','<p>When adding a gig, set it to repeat weekly, fortnightly or monthly, and choose when it ends. Each date shows in your diary. Editing or handing over one date only changes that date; the rest of the series stays as it is.</p>')}
  ${Q('What does a clash warning mean?',('<p>Two of your gigs on the same day overlap, so you can’t do both. Open either gig to hand one over to a stand-in or cancel it. '+APP_NAME+' uses load-in to finish times. If you haven’t set a finish time it assumes 3 hours after you go on stage, and if a gig has no times at all it’s flagged so you can check. Tap the red clashes notification at the top of the Diary to see every clash in one list. If there are more than 5 dates with clashes across different months, the list gets month arrows and a Today button, like the Diary. An arrow turns red when there are more clashes in that direction.</p>'))}
  ${Q('How do the Diary views work?','<p>'+(isLite()?'':'List shows your gigs one under another. Calendar shows the month as a calendar, and you can pick Compact, Stacked, Details or List to change how much each day shows.</p><p>')+'The list can show a day, a week or a month at a time: tap Day, Week or Month under the arrows. Settings, under “Diary list”, has the same choice (Monthly is the default). If you’ve moved to another month, switching to Day or Week opens on that month. The arrows at the top then move one day, week or month at a time. Today is greyed out when you’re already looking at today, this week or this month; tap it to jump back when you’ve moved away.</p><p>In Month, gigs whose date has passed are tucked into “Completed gigs” at the top of the list. Tap it to show the whole month again, and tap it again to tuck them away.</p><p>To hide your prices, turn on Privacy mode in Settings (see “Can I hide my prices?”).</p>')}
  ${Q('Can I hide my prices?','<p>Yes. Turn on Privacy mode in Settings. Prices show as £ • • •. On gig tiles they’re in the tile’s colour, in the Diary list and on the clashes, awaiting reply and handed over lists. Tap a price to show it, and tap again to hide it. Shown prices hide again by themselves after 10 seconds; change this under “Hide prices again after” (3, 5, 10 or 30 seconds, or Never).</p><p>It also covers the fee, deposit and expenses when you open a gig, the totals on Payments, Owed to you and Tax year, and the amounts on invoices. Tap any £ • • • to show it. Downloaded PDFs, spreadsheets and printed invoices always show the real amounts.</p>')}
  
  ${Q('Can I see a full scrolling calendar?','<p>Yes. On the Diary page, switch to Calendar and tap “See my full calendar” underneath it. You get every month in one long page, like a phone calendar app, starting at this month. Each day shows its gigs by name, in their status colour, and the month you’re looking at stays at the top as you scroll. Tap a day to see its gigs or add one, and tap Today to jump back to this month. To see a set period, tap From and To under the month and pick the first and last day (for example 2 July to 17 August); only those days are shown. Tap Clear to see everything again.</p>')}
  ${Q('Can I see my gigs in Google, Apple or Outlook calendar?','<p>Yes. Tap “Export” (with the calendar icon) on the Diary page. It downloads a calendar file you can open or import into your calendar app.</p><p>The file is a one-off copy of your gigs, so your calendar doesn’t update by itself when you change things in '+APP_NAME+'. Export again after changes.</p><p><b>If you cancel or hand over a gig:</b> gigs you exported stay in your calendar until you delete them there, as '+APP_NAME+' can’t reach into it.</p><ul><li><b>You’ll get a reminder.</b> When you delete a gig, remove a repeating date, or a stand-in takes one you handed over, a “Check your phone calendar” box lists the gigs to remove.</li><li><b>Exporting again helps in some apps.</b> The new file includes removed gigs marked as cancelled. Some calendar apps use this to remove or cross them out, but many ignore it, so don’t rely on it.</li><li><b>Safest option:</b> delete the gig from your calendar by hand, or delete all your old '+APP_NAME+' events and import the new file.</li></ul><p>Handed-over gigs are left out of new exports, as you’re no longer playing them.</p>')}
  
  ${Q('How do deposits work?','<p>When adding or editing a gig, enter the deposit amount and when it’s due. The gig shows a Deposit due tag until you tick “Deposit paid”, or open the gig and tap “Mark as paid”. If the due date passes first, the tag turns to Deposit overdue.</p><p>A deposit can’t be more than the fee (including any PA hire). Leave it blank if the gig has no deposit.</p>')}
  ${Q('Can I add notes to a gig?','<p>Yes. Open any gig and type in the Notes box: dress code, set times, parking, or how it went afterwards. It saves as you type, before or after the gig. Notes go to your stand-in when you hand a gig over, and they become read only once it’s handed over, so you both see the same thing. The same applies to gigs you’re standing in for: you can read the notes but not change them. If there are no notes on those gigs, the Notes box is hidden.</p>')}
  <h3 class="hsub">Handing over to a stand-in<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  
  ${Q('How do I hand a gig over?','<p>Open the gig and tap “Hand over to a stand-in”. You’ll only see stand-ins who do the roles the gig needs. Pick one or several, confirm the booker is happy to pay the stand-in directly, then send the message by WhatsApp or text. You can also add a reply deadline: if it passes with no reply, the gig is flagged so you can give them more time or ask someone else.</p><p><b>Asking several at once?</b> The first one to say yes gets the gig. Mark them in the gig, then let the others know it’s gone. Until then, the gig stays yours and shows as Awaiting.</p>')}
  
  ${Q('How do I know when a stand-in says yes?','<p>Their reply comes to you by WhatsApp, text or your phone’s share menu. Tap the link in it to update the gig for you. If you’re together, they can show you a QR code instead: open the gig and tap “Scan reply”. Or just open the gig and tap “said yes” or “can’t do it”.</p><p>The gig’s other buttons: “Their view” shows what the stand-in sees, “Show QR” lets them scan the request, “Copy reminder” copies a nudge to send, and “Cancel request” withdraws the handover.</p>')}
  ${Q('What are the notifications at the top of the Diary?','<p>They show what needs your attention: gig clashes (red), insurance or PAT test dates (dark or amber), gigs awaiting a stand-in’s reply, and gigs you’ve handed over. Tap a notification to deal with it. Alerts sit on the top row and handovers on the row below. When a notification is on its own, it stretches across the screen and shows the full details. Notifications disappear once there’s nothing to show.</p>')}
  ${Q('Where can I see all my handovers?','<p>At the top of the Diary, the Awaiting reply notification shows gigs still waiting for a stand-in, and the Handed over notification shows upcoming gigs someone is covering. With one gig, tapping the notification opens it. With more than one, it opens a page with each gig as a full tile. Up to 5 are all shown together. With more than 5 across different months, the page gets month arrows and a Today button, starting at the month of the next one. An arrow takes the notification’s colour when there are more gigs in that direction.</p>')}
  
  ${Q('Who pays the stand-in?','<p>The booker. When a stand-in accepts, they get the booked fee and the booker’s invoice details, and they invoice the booker directly. You never pay a stand-in, and the gig comes off your invoices. Before sending a handover you confirm you’ve told the booker.</p>')}
  ${Q(('What if my stand-in isn’t on '+APP_NAME+'?'),'<p>They get a link they can open on their phone. No account or download is needed. They reply to you by WhatsApp or text.</p>')}
  ${Q('What does the stand-in see when I hand over a gig?','<p>A page with the gig details: date, venue, times, fee and who to invoice. They add their name and tap “I can do it” or “Can’t do it”, then send their reply by WhatsApp, text or Share, or show you a QR code.</p><p>When they tap Done, they see “You’re all set”. If they use '+APP_NAME+' on that phone, the gig is added to their diary as one they’re standing in for, and “Open '+APP_NAME+'” takes them straight to it. If not, “Add to my diary” starts their diary with that gig. They can also add it to their phone calendar.</p>')}
  ${Q('Can I take a gig back after a stand-in has said yes?','<p>Yes. Open the gig and tap “Take the gig back”. It goes back in your diary and on your invoices. Send the stand-in the message, or tap “Show QR” and they open the gig and tap “Scan take-back QR”, and it comes out of their diary too. You can then ask another stand-in straight away.</p><p>If the stand-in changes their mind, they open the gig in their diary and tap “Give the gig back”. They send you a link or show you a QR code. Tap the link, or open the gig and tap “Scan reply”, to take it back.</p><p>If a stand-in tries to delete a gig they agreed to cover, they’re warned first and offered “Give the gig back”, so the person who handed it over isn’t left without a stand-in.</p>')}
  ${Q('Can I hand a gig over in person?','<p>Yes. On the last step of a handover, or on a gig that’s awaiting a reply, tap “Show QR”. The stand-in points their phone camera at it and the stand-in request opens on their phone. “Share” opens your phone’s share menu, including AirDrop on iPhone and Quick Share on Android.</p><p>Stand-ins can reply the same ways: “Show QR”, or “Share” for AirDrop, Quick Share and other apps.</p><p>To reply in person, the stand-in taps “I can do it” or “Can’t do it”, then “Show QR”. You open the gig and tap “Scan reply”, and your diary updates straight away.</p>')}
  ${Q('Can I see if my team are free?','<p>Not in this test version. There are no online accounts, so other people’s diaries can’t be seen. Ask them when you send the handover.</p>')}
  <h3 class="hsub" id="h-deps">My team<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  ${Q('Can I find stand-ins near a gig?','<p>Yes. People who’ve added their area to their own profile bring it with them, and you can type one for anyone else under Area when you add or edit them: a town (for example Leeds) or the start of their postcode (for example LS6) is enough. Add a postcode to the gig, and when you hand it over your stand-ins are sorted nearest first, with the distance shown. Tap 10, 25 or 50 mi to hide anyone further away. With no gig postcode, distances are from your own area. In My team, Filters has “Distance from me”.</p>')}
  ${Q('Who can see where I’m based?','<p>Only your nearest town, for example “Based near Halifax”, on your public page and when someone adds you to their team. Your full postcode is never saved. In Profile, “Your area”, type a town (for example Halifax) or the first half of your postcode (for example HX1); only that is kept, on this phone. It’s optional. If a town isn’t recognised, or there’s more than one place with that name, use the first half of the postcode instead.</p><p class="muted sm">Town names and distances use postcode district data: contains OS data © Crown copyright and database right 2026; contains Royal Mail data © Royal Mail copyright and database right 2026; source: Office for National Statistics, licensed under the Open Government Licence v3.0. Distances are straight-line and approximate.</p>')}
  ${Q('How do I add people to my team?','<p>Tap “Add to team” at the bottom of My team, then choose how: Scan QR, My QR, Type, Contacts, Page link or Invite.</p><p><b>Adding by QR:</b> standing together? One of you taps “My QR” to show a code. The other taps “Scan QR” and points their camera at it, and that person’s name, number, roles and kit are filled in, ready to save. It only works one way, so if you both want each other, swap and scan again. No camera? Tap “Use a photo instead” and pick a screenshot of the code.</p><p>A QR code can’t carry a photo, so people added this way show their initials. If they send you their public page link instead and you add them with “Page link”, their photo comes across too.</p>')}
  
  ${Q('Can I add a stand-in with an overseas number?','<p>Yes. Every phone number box has a country code on the left. Pick the country, then type the number. Pasting a number that starts with + or 00 picks the country for you. Call, WhatsApp and text buttons then use the right international number.</p>')}
  ${Q('How is My team arranged?','<ul><li><b>Favourites:</b> tap the star on someone. Favourites go to the top of My team and are listed first when you hand over a gig.</li><li><b>Suggested:</b> up to 5 stand-ins you’ve handed gigs to, based on gigs that have already happened. People you use often and recently come first. Favourites aren’t repeated here.</li><li><b>Recently added:</b> people you’ve added in the last 30 days.</li><li><b>See everyone:</b> your whole team, A to Z. If you can’t find someone you just added, they’re always here.</li></ul>')}
  
  
  ${Q('How do I find someone in my team?','<p>Tap a role under the search box (Musicians, Singers, DJs or MCs) to see just those people. Tap the same role again to go back to your full team.</p>'+(isLite()?'':'<p>Or start typing in the search bar, or tap Filters to narrow by role, kit, PLI or PAT. Active filters show as chips at the top. Tap a chip’s × to remove it, or “Clear all”.</p>'))}
  
  ${Q('What’s the difference between Invite and Send an invite?',('<p>Invite (in Add to team) is for one person you want on your team. They’re added to My team and show as Invited. Send an invite just recommends '+APP_NAME+' to anyone. It doesn’t add them to your team or share your gigs.</p>'))}
  ${Q('What do the PLI and PAT tags mean?','<ul><li><b>PLI</b>: they have public liability insurance.</li><li><b>PAT</b>: their equipment has been PAT tested in the last 12 months.</li><li><b>Ending soon</b>: it runs out within '+SOON+' days.</li><li><b>Expired</b>: it has run out.</li></ul>')}
  <h3 class="hsub" id="h-book">Bookings and your public page<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  ${Q('Can I see which gigs are on a day?','<p>Yes. On the Bookings page, tap any coloured day to see the gigs on it, then tap a gig to open it. If two gigs clash, the pop-up says so and “Sort it out” takes you straight to that date on your clashes page. This is only for you: bookers and anyone viewing your public page or shared availability see just the colours.</p>')}
  ${isLite()?'':Q('Can I show a set period, like 2 July to 17 August?','<p>Yes. On the Bookings page, tap From and To under the All week / Weekends buttons and pick the first and last day. Bookings, Preview and the availability link you share then show just those dates. A “Custom dates on” note under Share availability reminds you while it’s set. Tap Clear, or one of the weeks or months buttons, to go back to counting ahead from today.</p>')}
  ${Q('Can I mark days I’m away or can’t work?','<p>Yes. On the Bookings page, tap the button with the circle and line through it to open your unavailable days. Tap any day to mark it, tap again to unmark it, or tap “Add dates” to mark a whole holiday at once. The undo arrow steps back one change at a time, so if you add too many you can take back just those. “Clear” removes all your unavailable days, and undo brings them back. Unavailable days show in grey on Bookings, on the availability you share, in your Diary list and in your Diary calendar. If you add a gig on one of those days, you’re asked to check first. A day with a booked gig still shows as booked. If a gig and an unavailable day land on the same date, it counts as a clash: you’re warned when you mark the day or add the gig, and it appears in Gig clashes until you hand the gig over, cancel it or unmark the day. “Add dates” skips days that already have gigs.</p>')}
  ${Q('What do bookers see?','<p>Only Free (green), Pencilled (amber), Booked (red) or, if you’ve marked any, Unavailable (grey) for each date. They never see who the gig is for, where it is, or what you’re paid. Covered gigs show as free, as you’re no longer doing them.</p>')}
  ${isLite()?Q('How far ahead does Bookings show?','<p>Use the dropdown next to the colour key on Bookings to show 1, 2, 3, 6 or 12 months. Your shared availability link shows bookers the same months.</p>'):''}
  ${Q('Can I see my availability in months instead of weeks?','<p>Yes. On the Bookings page, tap “Months” (next to the Bookings heading) to choose 1, 2, 3, 6 or 12 months ahead, laid out like a calendar, one block per month. Tap “Weeks” to go back to 4, 8, 12, 26 or 52 weeks. Months is the default. Your choice is saved and your shared link shows bookers the same view.</p>')}
  ${Q('What does “w/c” mean?','<p>Week commencing. In the weeks view, each row starts with the date of that week’s Monday, so “w/c 5 Oct” is the week from Monday 5 to Sunday 11 October. If you’d rather not count in weeks, tap “Months” on the Bookings page for a calendar layout with no row labels.</p>')}
  ${Q('How do I share my availability?','<p>On the Bookings page, tap “Share availability”. On a phone this opens your share options (WhatsApp, Messages, email and so on); on a computer without sharing, the link is copied instead. It opens a short page with just your name and your Free, Pencilled and Booked dates. Tap the eye to see it first.</p><p>The link shows your diary as it is when you copy it, so send a fresh one after your diary changes.</p><p>To share your full public page instead (contact buttons, what you do, fees and equipment), tap “View profile” on Profile, then “Share profile” at the bottom, or show the QR icon at the top of Profile.</p>')}
  ${Q('Can I choose how people contact me?','<p>Yes. In Profile, under “Let people contact me by”, turn Call, WhatsApp and Email on or off, then save. Only the ones you leave on appear as buttons on your public page.</p>')}
  ${Q('Can I perform under more than one name?','<p>Yes. In Profile, under My acts, tap “Add an act”. Each act has its own name, photo, roles, genres, fees and public page. All your gigs stay in one diary, so clashes are still caught. When you add a gig, pick which act it’s for.</p><p>To change which act is your main profile, drag it to the top of My acts using the dots on the left, or open the act and tap “Make main profile”. Its gigs, photo, roles and fees swap over with it.</p>')}
  ${Q('How do I change or crop my photo or logo?','<p>In Profile, tap “Add photo” (or “Change photo”) and pick a picture. Drag it to move it and use the slider to zoom, then tap Save. To fix it later, tap Adjust. Act photos work the same way.</p><p>For your invoice logo, go to Profile, then Invoice details, then Layout. You can zoom out to fit a whole image, or zoom in to pick the logo out of a screenshot, and choose a Wide, Landscape or Square shape.</p>')}
  ${Q('What should I put under “Own decks or controller”?','<p>The make and model, for example Pioneer XDJ-RX3. It shows on your public page and, when someone adds you to their team, on their team list as “Decks: Pioneer XDJ-RX3”, so they know what you’ll bring.</p>')}
  ${Q('What name shows on my public page?','<p>Your stage name, if you’ve set one. Otherwise your name. If you have a stage name, you can choose whether your real name shows under it: untick “Show my real name on my public page” in Profile. Your real name is always used on invoices.</p>')}
  <h3 class="hsub" id="h-pay">Payments<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  ${Q('How are invoices made?',('<p>'+APP_NAME+' makes one invoice per client for each month, from the gigs in your diary. Pencilled gigs are left out, and so are gigs you’ve handed over. If you want a payment due date on them, turn it on in Profile, then Invoice details.</p>'))}
  ${Q('Can I change an invoice?','<p>Yes. Open the invoice and tap Edit to change the names, addresses, gig details or note. Changes are saved back to the gig and client, so the next invoice matches.</p>')}
  ${Q('Where do my bank details go?','<p>Profile, then Invoice details, then Bank. Account numbers are 8 digits and sort codes are 6 digits; the dashes are added for you. They’re printed on your invoices so clients know where to pay you.</p>')}
  ${Q('What does the Tax year page show?','<p>On Payments, tap Tax year. It adds up your gig fees for the UK tax year, 6 April to 5 April: what you’ve earned so far, what’s booked ahead, and a total for each month. Use the arrows to see other years, and Download to get a spreadsheet of every gig for your tax return. Pencilled gigs and gigs you handed over aren’t counted. Expenses you add to gigs give you a profit so far figure (before tax).</p>')}
  ${Q('Where are the privacy policy and terms?','<p>In Settings, scroll down and tap About '+APP_NAME+'. You’ll find About '+APP_NAME+', the privacy policy, the terms of use, the open-source libraries the app uses, and Report a problem, which fills in an email to us for you to send.</p>')}
  ${Q('Can I rely on the figures for my tax return?','<p>Use them as a starting point, not as advice. Totals, profit, invoices and downloads are worked out from what you enter, so a missing gig, a wrong fee or an expense you forgot will be carried through. Check every figure, invoice and export before you use it, and get advice from an accountant or HMRC before you file a tax return. '+APP_NAME+' isn’t responsible for mistakes in invoices or tax returns.</p>')}
  ${Q('How do I know who still owes me?','<p>Once a month has ended, each invoice on Payments shows when it’s due, then turns to Overdue if the date passes. Invoices are due by the payment terms on your profile, or 30 days after the invoice date if you haven’t set any. Tap Mark paid when the money arrives (Mark unpaid undoes it).</p><p>“Owed to you” at the top of Payments adds up every unpaid invoice from every month. Tap it to see the list, mark invoices paid, or tap Copy chaser to copy a polite reminder with your bank details, ready to paste into an email or message.</p>')}
  ${Q('Can I track expenses?','<p>Yes, with All features on. Open a gig, pick the type (travel, parking, kit and strings, food, accommodation or other), enter the amount and tap Add. Tap the cross to remove one. Tax year then shows your expenses and profit so far, and the spreadsheet download includes them. Profit is before tax. On a repeating gig, an expense belongs to that one date.</p>')}
  ${Q('How do I send invoices to my accountant?','<p>On Payments, tap “Send invoices”, pick the months, and you get one PDF plus a spreadsheet to email. Save your accountant’s details in Profile, then Invoice details, Accountant.</p>')}
  ${Q('What are clients?','<p>The bandleaders, agencies, venues and people you invoice. Their name, email and address go on the invoices you send them. Star the ones you use most to keep them at the top.</p><p>Use the List and Details switch to choose a short list of names, or larger tiles that also show each client’s email and address.</p>')}
  <h3 class="hsub" id="h-ins">Insurance and safety<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  ${Q('Why add my PLI and PAT details?',('<p>Many venues and bookers won’t let you play without public liability insurance (PLI), and some ask for proof that your equipment has been PAT tested. Adding them here shows bookers straight away that you’re covered, and it helps stand-ins and bandleaders trust you with their gigs.</p><p>'+APP_NAME+' also keeps an eye on the dates for you. You’ll get a warning ')+SOON+' days before your insurance runs out or your PAT test is due, so you’re never caught out on the night.</p><p>To add them, go to Profile, then Equipment, and tick PLI or PAT.</p>')}
  <h3 class="hsub" id="h-data">Your data<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3>
  ${Q('Where is my data kept?',('<p>Only on this phone, in this browser. '+APP_NAME+' has no accounts and no online storage, so nothing you enter is sent to us. The links you share carry only what’s shown on them.</p>'))}
  ${Q('What if I change phone or clear my browser?',('<p>Your data goes with it. Back up now and then from Settings (the cog at the top of Profile), then Your data. If it’s been over a month, the Diary shows a reminder with a Back up button; Later hides it for a week. On a new phone, open '+APP_NAME+' and tap “Restore a backup”.</p>'))}
  ${Q('Can I copy a gig to a new date?','<p>Yes. Open the gig and tap Book again. A new gig opens with the act, venue, times, fee and client already filled in; pick the date and save. Notes aren’t copied. Book again isn’t offered on gigs you’re covering for someone else. If you copy one date of a repeating gig, the new gig is a single date, not a new repeating series.</p>')}
  ${Q('How do I start with my own gigs?',('<p>'+APP_NAME+' starts with sample gigs, stand-ins and clients so you can try it out. When you’re ready, tap “Start with a clean diary” on the Diary page, then add your details in Profile.</p><p>To get the sample data back, tap “Load sample data” under an empty diary, or in Settings (the cog at the top of Profile) under Your data. It replaces everything on the phone, so back up first.</p>'))}
  ${Q('Using an iPhone?',('<p>Use '+APP_NAME+' in Safari rather than adding it to your Home Screen. Links from WhatsApp open in Safari, and a Home Screen app keeps its data separately, so replies wouldn’t reach your diary.</p>'))}
  ${Q('What does All features add?','<p>'+APP_NAME+' keeps things simple to start with: your diary, adding gigs, handing gigs over, your team and sharing your availability.</p><p>If you want more, go to Settings and turn on All features. It adds Payments and invoices, the calendar view, the full scrolling calendar and calendar export, custom date ranges for Bookings, your area and distances to your team, colour filters, repeating gigs, deposits, equipment, extra acts, links, insurance and PAT reminders, and the longer profile sections. Your public page also shows your insurance, equipment, links and nearest town.</p><p>Turn All features off again whenever you like. Nothing is deleted either way, and Help only shows questions for the features you can see.</p>')}
  ${Q('Where are the settings?','<p>Tap Settings in the bottom bar, or on the Profile page tap the cog next to the QR code. Settings holds All features, dark mode, your accent colour, your button style, Your data (back up, restore, load sample data and delete everything), Send feedback and the version number.</p>')}
  ${Q('Can I change how the app looks?','<p><b>Colour:</b> in Settings, pick an accent colour: Amethyst, Fuchsia, Turquoise or Graphite. It changes buttons, links and highlights. Green, amber, red and blue aren’t offered, because the app uses them for booked, pencilled, warnings and stand-in gigs, and they need to stand out.</p><p>If you find some colours hard to tell apart, pick Colour-blind safe. It changes the status colours to a set designed for colour blindness, and booked dates on Bookings get stripes and a line through, so you don’t need to rely on colour.</p><p><b>Buttons:</b> in Settings, pick a button style. The default shows common actions (edit, delete, close, back, share and help) as icons, and other buttons as an icon and a word. You can also choose words only, icons only, or an icon and a word on every button. If a word won’t fit next to its icon on your screen, the button shows the word only. The buttons at the bottom of Profile always show words.</p>')}
  
  ${Q('How do I delete everything?','<p>Go to Profile, tap the cog for Settings, then under Your data tap “Delete all my data”. It can’t be undone.</p>')}
  </div>
  <div class="fbbox"><p><b>Something not right, or an idea?</b><span class="muted sm">Tell us what you were doing and what happened.</span></p><a class="primary" style="text-decoration:none" href="${fbHref()}">Send feedback</a></div>
  <p class="muted sm verline">${APP_NAME} ${APP_VER} · Test version</p>
  <p class="resetline" style="margin-top:6px">Sample data: <button class="link" data-a="reset">Load sample data</button></p>${FOOTLOGO}`;
}
const defNote=inv=>{const P=state.profile,n=(P.invNote??'Not VAT registered.').trim(),d=inv.due?`Payment due within ${+P.payDays||14} days.`:'';return [n,d].filter(Boolean).join(n&&/[.!?]$/.test(n)?' ':n?'. ':'')};
const invNote=inv=>{const n=(state.invNotes||{})[inv.num];return n!==undefined?n:defNote(inv)};
const hoursOf=g=>+((state.invHours||{})[g.id])||0;
const hrsText=h=>{h=+h;return `${h%1?h.toFixed(2).replace(/0$/,''):h} hour${h===1?'':'s'}`};
function logoBlock(){const P=state.profile;
  return P.logo?`<div class="logorow"><div class="logothumb"><img src="${P.logo}" alt="Your invoice logo"></div><div class="actions" style="margin:0"><button type="button" class="ghost sm" data-a="logo">Change logo</button>${P.logoSrc?'<button type="button" class="ghost sm" data-a="adjlogo">Adjust</button>':''}<button type="button" class="ghost sm danger" data-a="rmlogo">Remove</button></div></div>`
    :`<button type="button" class="ghost sm" data-a="logo">Upload logo</button>`}
const miniAv=(name,photo)=>`<div class="avatar mini">${photo?`<img src="${photo}" alt="">`:esc(String(name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div>`;
let AF_PHOTO=null,AF_SRC=null,AF_CROP=null;
const afPhotoBlock=name=>`<div class="afphoto">${miniAv(name,AF_PHOTO).replace('avatar mini','avatar mid')}<div><b>Act photo</b><p class="muted sm" style="margin:2px 0 8px">Shown on this act’s public page.</p><div class="actions"><button type="button" class="ghost sm" data-a="aphoto">${AF_PHOTO?'Change photo':'Add photo'}</button>${AF_PHOTO&&AF_SRC?'<button type="button" class="ghost sm" data-a="adjaphoto">Adjust</button>':''}${AF_PHOTO?'<button type="button" class="ghost sm danger" data-a="rmaphoto">Remove</button>':''}</div></div></div>`;
function qrSVG(text){const q=qrcode(0,text.length>400?'L':'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg class="qrsvg" viewBox="0 0 ${n+m*2} ${n+m*2}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#0c0e14"/></svg>`}
function qrView(actId){ui.qrAct=actById(actId)?actId:'main';const name=actName(ui.qrAct),url=pubLink(ui.qrAct);
  modal(`<div class="mh"><div><p class="eyebrow">Public page QR code</p><h3>${esc(name)}</h3></div>${X}</div>
  ${acts().length?`<div class="subnav qrtabs">${[['main',shownName()],...acts().map(a=>[a.id,a.name])].map(([id,n])=>`<button type="button" class="${id===ui.qrAct?'on':''}" data-a="qract" data-id="${id}">${esc(n)}</button>`).join('')}</div>`:''}
  <div class="qrwrap">${qrSVG(url)}</div>
  <p class="muted sm" style="text-align:center;margin:0 0 14px">Let people scan this to open your public page. It shows your diary as it is today.</p>
  <div class="invbtns"><button class="primary" data-a="qrcopy">Copy link</button><button class="ghost" data-a="close">Done</button></div>`)}
function actsSection(){const P=state.profile,rl=r=>r.map(x=>ROLES[x]).join(' · ');
  const many=acts().length>0,row=(id,name,roles,main,photo)=>`<div class="arow" data-act="${id}">${many?'<button type="button" class="ahandle" aria-label="Drag to reorder" title="Drag to reorder"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="display:block"><g fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></g></svg></button>':''}${miniAv(name,photo)}<div class="am"><b>${esc(name)}</b><span class="muted sm">${main?'Main profile'+(roles.length?' · '+esc(rl(roles)):''):esc(rl(roles))}</span></div><div class="abtns">${main?'':`<button class="ghost sm" data-a="editact" data-id="${id}">Edit</button>`}<button class="ghost sm" data-a="pubview" data-id="${id}">View</button></div></div>`;
  return `<div class="psec" id="actsec"><h3 class="hsub">My acts<button class="totop" data-a="totop" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h3><p class="muted sm hint">Perform under more than one name? Add each one as an act. Each act gets its own public page, and all your gigs stay in one diary.${acts().length?' Drag an act to the top to make it your main profile.':''}</p>

privacy:()=>`${legalDraft()}<p class="legallead">This policy explains what information ${APP_NAME} uses, where it’s kept and what your rights are. Last updated ${LEGAL_DATE}.</p>
<h3>1. Who we are</h3><p>${APP_NAME} is run by ${OPERATOR}. For anything about privacy, email <a href="mailto:${OP_EMAIL}">${OP_EMAIL}</a>.</p>
<h3>2. What the app stores</h3><p>Only what you type in or add: your profile (name, roles, area, contact details, logo), your gigs, notes and expenses, your clients and their contact details, the people in your team, invoice details including your bank account and sort code, and your settings.</p>
<h3>3. Where it’s kept</h3><p>On your device, in your browser’s storage. This test version has no server, so we don’t receive, see or keep a copy of your data. Backups you make are files you save and look after yourself.</p>
<h3>4. What we don’t do</h3><p>No adverts, no tracking, no analytics and no cookies. The fonts are built into the app, so nothing loads from other websites when you open it.</p>
<h3>5. When information leaves your device</h3><p>Only when you choose to send it:</p><ul><li>Share links and QR codes for your availability, profile and handovers carry the details inside them. Anyone with the link can read them.</li><li>Invoices, backups and spreadsheets are files you download, email or print.</li><li>Feedback, problem reports and emails open your own email app; that provider’s privacy terms apply. A problem report can include device details (phone, browser, screen size, app version and settings) if you leave that box ticked, but never your diary.</li><li>Tapping a postcode opens Google Maps, where Google’s privacy policy applies.</li></ul>
<h3>6. Other people’s details</h3><p>If you add clients or stand-ins, you’re responsible for having a good reason to keep their details and for keeping them up to date. Only share their information in ways they’d expect.</p>
<h3>7. How long it’s kept</h3><p>Until you delete it. “Start with a clean diary” or clearing your browser data removes everything from the device. Delete any backup files you no longer need.</p>
<h3>8. Your rights</h3><p>Under UK data protection law you can ask to see, correct or delete your personal data. In this test version all of it is on your own device, so you can do this yourself in the app. If you think we’ve handled your information wrongly, email us first. You can also complain to the Information Commissioner’s Office (ico.org.uk).</p>
<h3>9. Changes</h3><p>We’ll update this policy before adding accounts, syncing or anything else that sends data to a server, and we’ll tell you in the app.</p>`,
terms:()=>`${legalDraft()}<p class="legallead">These terms apply when you use ${APP_NAME}. By using the app you agree to them. Last updated ${LEGAL_DATE}.</p>
<h3>1. Who we are</h3><p>${APP_NAME} is run by ${OPERATOR} (“we”). Contact: <a href="mailto:${OP_EMAIL}">${OP_EMAIL}</a>.</p>
<h3>2. Test version</h3><p>This is a test version. It’s free, it may change or stop working, and features may be added or removed. It’s provided as it is, without any promise that it will be error free or always available.</p>
<h3>3. Your data</h3><p>Your diary is stored on your device. You’re responsible for backing it up. We can’t recover data that’s lost because a browser was cleared, a device was lost or replaced, or anything else outside our control.</p>
<h3>4. Money, invoices and tax</h3><p>Fees, totals, invoices, tax year figures, profit and spreadsheets are worked out from what you enter. They’re a guide only and are not financial, tax or legal advice. Check every figure, invoice and export before you use or send it, and get advice from an accountant or HMRC before you file a tax return. You’re responsible for the invoices you send and the tax returns you file.</p>
<h3>5. Handovers and other musicians</h3><p>${APP_NAME} helps you pass gigs to other people. Any arrangement, including the fee, payment, turning up and the quality of the performance, is between you, the stand-in and the booker. We’re not part of that arrangement and aren’t responsible if something goes wrong.</p>
<h3>6. Using the app fairly</h3><p>Use ${APP_NAME} lawfully. Only add other people’s details when you have a good reason to, don’t use share links to send anything misleading or harmful, and don’t try to break or misuse the app.</p>
<h3>7. Our liability</h3><p>As far as the law allows, we’re not liable for any loss of data, income, bookings or profit, or for any indirect loss, arising from your use of ${APP_NAME}. Nothing in these terms limits liability for death or personal injury caused by negligence, for fraud, or for anything else that can’t be limited by law.</p>
<h3>8. Ownership</h3><p>The ${APP_NAME} name, logo and app belong to ${OPERATOR}. Your diary and everything you enter belong to you. Fonts and code made by others are listed under Open-source libraries.</p>
<h3>9. Changes</h3><p>We may update these terms. We’ll show the date at the top and tell you in the app about important changes.</p>
<h3>10. Law</h3><p>These terms are governed by the law of England and Wales, and the courts of England and Wales have jurisdiction.</p>`,

/* ---------- calendar feed (.ics) ---------- */
function downloadICS(){
  const e=t=>String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=(d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z')(new Date());

  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//'+APP_NAME+'//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+APP_NAME+' gigs'];
  for(const u in now){const v=now[u],g=v.g;
    L.push('BEGIN:VEVENT','UID:'+u,'SEQUENCE:'+seq,'DTSTAMP:'+stamp,'DTSTART:'+v.s,'DTEND:'+v.e,'STATUS:CONFIRMED','SUMMARY:'+e(v.sum),'LOCATION:'+e(v.loc),
      'DESCRIPTION:'+e(`Load-in ${g.loadIn||'?'}, on ${g.start||'?'}. Fee ${money(gigTotal(g))}.${g.equip==='own'?' Bring own PA.':''}${+g.depAmt?` Deposit ${money(g.depAmt)} ${g.depPaid?'paid':'not paid'}.`:''}`),'END:VEVENT');
    sent[u]={s:v.s,e:v.e,sum:v.sum,loc:v.loc,d:g.date}}
  let gone=0;const old=iso(addDays(new Date(),-30));
  for(const u in sent){if(now[u])continue;const v=sent[u];if(v.d<old){delete sent[u];continue}gone++;
    L.push('BEGIN:VEVENT','UID:'+u,'SEQUENCE:'+seq,'DTSTAMP:'+stamp,'DTSTART:'+v.s,'DTEND:'+v.e,'STATUS:CANCELLED','SUMMARY:'+e('Cancelled: '+v.sum),'LOCATION:'+e(v.loc),'END:VEVENT')}
  L.push('END:VCALENDAR');save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='gigs.ics';document.body.appendChild(a);a.click();a.remove();
  toast(gone?`Calendar file saved. ${gone} removed gig${gone>1?'s are':' is'} marked as cancelled.`:'Bookings saved as a calendar file. Open it to add them to your calendar.');
}
